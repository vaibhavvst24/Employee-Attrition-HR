<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/png" href="/static/employee (1).png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Employee Attrition Predictor</title>
    <style>
* {
    margin: 100;
    padding: 40;
}

body {
    font-family: 'Poppins', sans-serif;
    background:  linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.55)),
    url("/static/gradient-1768319778182.png") no-repeat center center/cover;
    min-height: 40vh;
    background-size: cover;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Main Card */
.container {
    width: 640px;
    background: rgba(255, 255, 255, 0.01);
    backdrop-filter: blur(15px);
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.50);
}

/* Heading */
h2 {
    text-align: center;
    color: #e5e7eb;
    font-size: 26px;
    margin-bottom: 15px;
    font-weight: 700;
}

/* Grid layout */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

/* Labels */
label {
    color: #cbd5f5;
    font-size: 18px;
    margin-bottom: 5px;
    display: block;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.1);
    color: #BEDBFF;
    font-size: 14px;
    transition: 0.3s ease;
}

input:focus, select:focus {
    background: rgba(255,255,255,0.15);
    box-shadow: 0 0 0 2px #3b82f6;
}

/* Button */
button {
    width: 100%;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    margin-top: 25px;
    cursor: pointer;
    font-weight: 500;
    transition: 0.3s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(59,130,246,0.5);
}

/* Result Card */
.result {
    margin-top: 25px;
    background: rgba(59,130,246,0.15);
    padding: 18px;
    border-radius: 12px;
    text-align: center;
    font-size: 18px;
    color: #CAD5E2;
    font-weight: 600;
    box-shadow: 0 0 8px rgba(59,130,246,0.3);
}

@media (max-width: 600px) {
    .container { padding: 20px; }
    h2 { font-size: 20px; }
}

</style>
</head>

<body>
<div class="container">
    <h2>Employee Attrition Prediction</h2>

    <form method="POST" action="/predict">
        <div class="grid">

            <label>Age</label>
            <input type="number" name="Age" required>

            <label>Gender</label>
            <select name="Gender">
                <option>Male</option>
                <option>Female</option>
            </select>

            <label>Marital Status</label>
            <select name="MaritalStatus">
                <option>Single</option>
                <option>Married</option>
                <option>Divorced</option>
            </select>

            <label>Department</label>
            <select name="Department">
                <option>Sales</option>
                <option>Research & Development</option>
                <option>Human Resources</option>
            </select>

            <label>Job Role</label>
            <select name="JobRole">
                <option>Sales Executive</option>
                <option>Research Scientist</option>
                <option>Laboratory Technician</option>
                <option>Manufacturing Director</option>
                <option>Healthcare Representative</option>
            </select>

            <label>Business Travel</label>
            <select name="BusinessTravel">
                <option>Travel_Rarely</option>
                <option>Travel_Frequently</option>
                <option>Non-Travel</option>
            </select>

            <label>Distance From Home</label>
            <input type="number" name="DistanceFromHome" required>

            <label>Monthly Income</label>
            <input type="number" name="MonthlyIncome" required>

            <label>Over Time</label>
            <select name="OverTime">
                <option>Yes</option>
                <option>No</option>
            </select>

            <label>Job Satisfaction (1–4)</label>
            <input type="number" name="JobSatisfaction" min="1" max="4">

            <label>Environment Satisfaction (1–4)</label>
            <input type="number" name="EnvironmentSatisfaction" min="1" max="4">

            <label>Relationship Satisfaction (1–4)</label>
            <input type="number" name="RelationshipSatisfaction" min="1" max="4">

            <label>Work Life Balance (1–4)</label>
            <input type="number" name="WorkLifeBalance" min="1" max="4">

            <label>Job Involvement (1–4)</label>
            <input type="number" name="JobInvolvement" min="1" max="4">

            <label>Total Working Years</label>
            <input type="number" name="TotalWorkingYears">

            <label>Training Times Last Year</label>
            <input type="number" name="TrainingTimesLastYear">

            <label>Stock Option Level</label>
            <input type="number" name="StockOptionLevel">

            <label>Percent Salary Hike</label>
            <input type="number" name="PercentSalaryHike">

            <label>Number of Companies Worked</label>
            <input type="number" name="NumCompaniesWorked">

            <label>Education</label>
            <input type="number" name="Education">

            <label>Education Field</label>
            <select name="EducationField">
                <option>Life Sciences</option>
                <option>Medical</option>
                <option>Marketing</option>
                <option>Technical Degree</option>
                <option>Human Resources</option>
            </select>

            <label>Work Life Balance (1–4)</label>
            <input type="number" name="WorkLifeBalance" min="1" max="4" required>
        </div>

        <button type="submit">Predict Attrition</button>
    </form>

    {% if prediction %}
    <div class="result">
        Attrition Risk: {{ prediction }} <br>
        Probability: {{ probability }}
    </div>
    {% endif %}


</div>
</body>
</html>
